name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group local
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy --strict src
      - name: Tests
        run: pytest -q
      - name: Verify offline graph exports
        run: python scripts/export_langgraph_mermaid.py --check
