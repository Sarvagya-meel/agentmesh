name: system-sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_langsmith:
        description: "Fail if LangSmith credentials or trace checks are unavailable"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  sanity:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    env:
      AGENTMESH_SANITY_MODE: ci
      AGENTMESH_REQUIRE_LANGSMITH: ${{ github.event_name == 'pull_request' && '1' || (inputs.require_langsmith == 'true' && '1' || '0') }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group local
      - name: Verify release branch contains latest develop
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
        run: python tests/tools/verify_release_branch.py
      - name: Write CI env file
        run: |
          {
            echo "APP_ENV=ci"
            echo "LLM_PROVIDER=groq"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}"
            echo "LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-AgentMesh}"
            echo "LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"
            echo "LANGSMITH_API_KEY=${LANGSMITH_API_KEY}"
          } > .env
      - name: Run system sanity
        run: |
          args=(--mode ci)
          if [ "${AGENTMESH_REQUIRE_LANGSMITH}" = "1" ]; then
            args+=(--require-langsmith)
          fi
          python tests/tools/system_sanity.py "${args[@]}"
      - name: Write concise PR summary
        if: always()
        run: |
          if [ -f outputs/system_sanity/system_sanity_report.md ]; then
            cat outputs/system_sanity/system_sanity_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# AgentMesh System Sanity Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Sanity report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-sanity
          path: |
            outputs/system_sanity/system_sanity_report.json
            outputs/system_sanity/system_sanity_report.csv
            outputs/system_sanity/system_sanity_report.md
            outputs/system_sanity/system_sanity_summary.json
