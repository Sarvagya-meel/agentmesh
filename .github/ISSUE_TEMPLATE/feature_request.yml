name: Feature request
description: Propose a scoped AgentMesh improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or runtime problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: release-impact
    attributes:
      label: Release Impact
      options:
        - No release impact
        - Patch
        - Minor
        - Major or migration required
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation Ideas
      description: What tests, docs, or demos should prove this works?
