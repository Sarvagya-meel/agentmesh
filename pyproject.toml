[project]
name = "agentmesh"
version = "0.1.0"
description = "A production-grade hybrid multi-agent system for job-search automation."
requires-python = ">=3.11"

[dependency-groups]
shared = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "psycopg[binary]",
]
langgraph-framework = [
    "langgraph",
]
adk-framework = [
    "google-adk==2.7.0",
    "litellm==1.97.0",
    "google-genai",
]
postgres-checkpoint = [
    "langgraph-checkpoint-postgres",
]
ui-framework = [
    "streamlit",
]
dev-tools = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

control-plane = [
  { include-group = "shared" },
  { include-group = "langgraph-framework" },
  { include-group = "postgres-checkpoint" },
]

agent-langgraph = [
  { include-group = "shared" },
  { include-group = "langgraph-framework" },
]

agent-adk = [
  { include-group = "shared" },
  { include-group = "adk-framework" },
]

local = [
  { include-group = "shared" },
  { include-group = "langgraph-framework" },
  { include-group = "adk-framework" },
  { include-group = "postgres-checkpoint" },
  { include-group = "ui-framework" },
  { include-group = "dev-tools" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# src layout: tell mypy where to find the package
mypy_path = "src"

# src layout: package lives under src/agentmesh
# When using pip install -e . or setuptools, this ensures correct discovery
[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
