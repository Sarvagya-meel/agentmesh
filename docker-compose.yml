services:
  postgres:
    image: postgres:15
    container_name: agentmesh-postgres
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
    ports:
      - "5432:5432"
    volumes:
      - agentmesh-postgres-data:/var/lib/postgresql/data
      - ./db/postgress/ddls:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator-supervisor-agent:
    build:
      context: .
    image: agentmesh-agent-orchestrator-supervisor-agent
    container_name: agentmesh-agent-orchestrator-supervisor-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      REGISTRY_BACKEND: postgres
      EVENT_STORE_BACKEND: postgres
      ORCHESTRATOR_CHECKPOINT_BACKEND: postgres
      AGENT_STALE_SECONDS: 180
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.1}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-langgraph-copilot:
    build:
      context: .
    image: agentmesh-agent-langgraph-copilot
    container_name: agentmesh-agent-langgraph-copilot
    depends_on:
      orchestrator-supervisor-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      AGENT_REGISTRY_URL: http://orchestrator-supervisor-agent:8000/registry/agents
      AGENT_ENDPOINT: http://agent-langgraph-copilot:8101
      AGENT_RUNTIME_KIND: langgraph
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.1}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
      POLL_INTERVAL_SECONDS: 2
      WORKER_HEARTBEAT_SECONDS: 60
      WORKER_REQUEST_TIMEOUT_SECONDS: 30
    ports:
      - "8101:8101"
    command:
      [
        "uvicorn",
        "agentmesh.agents.runtime:app",
        "--host=0.0.0.0",
        "--port=8101",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-googleadk-chatagent:
    build:
      context: .
    image: agentmesh-agent-googleadk-chatagent
    container_name: agentmesh-agent-googleADK-Chatagent
    depends_on:
      orchestrator-supervisor-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      AGENT_REGISTRY_URL: http://orchestrator-supervisor-agent:8000/registry/agents
      AGENT_ENDPOINT: http://agent-googleadk-chatagent:8102
      AGENT_RUNTIME_KIND: google-adk
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.1}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
      POLL_INTERVAL_SECONDS: 2
      WORKER_HEARTBEAT_SECONDS: 60
      WORKER_REQUEST_TIMEOUT_SECONDS: 30
    ports:
      - "8102:8102"
    command:
      [
        "uvicorn",
        "agentmesh.agents.runtime:app",
        "--host=0.0.0.0",
        "--port=8102",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  streamlit:
    build:
      context: .
    image: agentmesh-streamlit-ui
    container_name: agentmesh-streamlit
    depends_on:
      orchestrator-supervisor-agent:
        condition: service_healthy
      agent-langgraph-copilot:
        condition: service_healthy
      agent-googleadk-chatagent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      AGENT_REGISTRY_URL: http://orchestrator-supervisor-agent:8000/registry/agents
      AUTO_REGISTER_AGENTS: "false"
      AGENT_STALE_SECONDS: 180
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    ports:
      - "8501:8501"
    command:
      [
        "streamlit",
        "run",
        "src/agentmesh/ui/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

volumes:
  agentmesh-postgres-data:
