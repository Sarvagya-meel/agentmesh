name: agentmesh

x-llm-config: &llm-config
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
  GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-medium}
  GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.1}
  GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-4096}
  GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}

x-agent-environment: &agent-environment
  <<: *llm-config
  APP_ENV: local
  DATABASE_URL: postgresql://agentmesh:agentmesh@postgres:5432/agentmesh
  AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
  AGENT_REGISTRY_URL: http://orchestrator-supervisor-agent:8000/registry/agents
  AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-4}
  AGENT_SHUTDOWN_TIMEOUT_SECONDS: ${AGENT_SHUTDOWN_TIMEOUT_SECONDS:-30}
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-60}
  WORKER_REQUEST_TIMEOUT_SECONDS: ${WORKER_REQUEST_TIMEOUT_SECONDS:-30}

x-agent-dependencies: &agent-dependencies
  orchestrator-supervisor-agent:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-langgraph-agent: &langgraph-agent
  build:
    context: ../..
    dockerfile: deployment/docker/Dockerfile.Agent
    args:
      AGENT_PACKAGE: agent_langgraph_copilot
      DEPENDENCY_GROUP: agent-langgraph
  image: agentmesh-agent-langgraph-copilot
  depends_on: *agent-dependencies
  volumes:
    - type: bind
      source: ./src
      target: /app/src
      read_only: false
  command:
    - uvicorn
    - agentmesh.agents.agent_langgraph_copilot.app:app
    - --host=0.0.0.0
    - --port=8101
    - --reload
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2)\""]
    interval: 10s
    timeout: 5s
    retries: 10

x-adk-agent: &adk-agent
  build:
    context: ../..
    dockerfile: deployment/docker/Dockerfile.Agent
    args:
      AGENT_PACKAGE: agent_adk_spark
      DEPENDENCY_GROUP: agent-adk
  image: agentmesh-agent-googleadk-chatagent
  depends_on: *agent-dependencies
  volumes:
    - type: bind
      source: ./src
      target: /app/src
      read_only: false
  command:
    - uvicorn
    - agentmesh.agents.agent_adk_spark.app:app
    - --host=0.0.0.0
    - --port=8102
    - --reload
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=2)\""]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  postgres:
    image: postgres:15
    container_name: agentmesh-postgres
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
    ports:
      - "5432:5432"
    volumes:
      - agentmesh-postgres-data:/var/lib/postgresql/data
      - ../postgres/ddls:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.Migrate
    container_name: agentmesh-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentmesh:agentmesh@postgres:5432/agentmesh
    restart: "no"

  orchestrator-supervisor-agent:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.Service
      args:
        DEPENDENCY_GROUP: control-plane
    image: agentmesh-agent-orchestrator-supervisor
    container_name: agentmesh-orchestrator-supervisor
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: false
    environment:
      <<: *llm-config
      APP_ENV: local
      DATABASE_URL: postgresql://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      REGISTRY_BACKEND: postgres
      EVENT_STORE_BACKEND: postgres
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_STORE_BACKEND: postgres
      AGENT_STALE_SECONDS: ${AGENT_STALE_SECONDS:-180}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-langgraph-copilot:
    <<: *langgraph-agent
    profiles: ["combined"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: combined
      AGENT_ENDPOINT: http://agent-langgraph-copilot:8101
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_STORE_BACKEND: postgres
      LANGGRAPH_LONG_TERM_MEMORY_ENABLED: ${LANGGRAPH_LONG_TERM_MEMORY_ENABLED:-false}
    ports:
      - "8101:8101"

  agent-langgraph-copilot-api:
    <<: *langgraph-agent
    profiles: ["split"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: api
      AGENT_ENDPOINT: http://agent-langgraph-copilot-api:8101
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_STORE_BACKEND: postgres
      LANGGRAPH_LONG_TERM_MEMORY_ENABLED: ${LANGGRAPH_LONG_TERM_MEMORY_ENABLED:-false}

  agent-langgraph-copilot-worker:
    <<: *langgraph-agent
    profiles: ["split"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: worker
      AGENT_ENDPOINT: http://agent-langgraph-copilot-api:8101
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_STORE_BACKEND: postgres
      LANGGRAPH_LONG_TERM_MEMORY_ENABLED: ${LANGGRAPH_LONG_TERM_MEMORY_ENABLED:-false}

  agent-googleadk-chatagent:
    <<: *adk-agent
    profiles: ["combined"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: combined
      AGENT_ENDPOINT: http://agent-googleadk-chatagent:8102
      GOOGLE_ADK_SESSION_BACKEND: database
    ports:
      - "8102:8102"

  agent-googleadk-chatagent-api:
    <<: *adk-agent
    profiles: ["split"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: api
      AGENT_ENDPOINT: http://agent-googleadk-chatagent-api:8102
      GOOGLE_ADK_SESSION_BACKEND: database

  agent-googleadk-chatagent-worker:
    <<: *adk-agent
    profiles: ["split"]
    environment:
      <<: *agent-environment
      AGENT_RUNTIME_ROLE: worker
      AGENT_ENDPOINT: http://agent-googleadk-chatagent-api:8102
      GOOGLE_ADK_SESSION_BACKEND: database

  streamlit:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.Service
      args:
        DEPENDENCY_GROUP: ui
    image: agentmesh-service-ui
    container_name: agentmesh-streamlit
    depends_on:
      orchestrator-supervisor-agent:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: false
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://agentmesh:agentmesh@postgres:5432/agentmesh
      AGENTMESH_API_URL: http://orchestrator-supervisor-agent:8000
      AGENT_REGISTRY_URL: http://orchestrator-supervisor-agent:8000/registry/agents
      AUTO_REGISTER_AGENTS: "false"
      AGENT_STALE_SECONDS: ${AGENT_STALE_SECONDS:-180}
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - src/agentmesh/services/service_agentmesh_ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.fileWatcherType
      - "poll"

volumes:
  agentmesh-postgres-data:
